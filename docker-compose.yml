services:
  # ============================================================================
  # Infrastructure: 4 Isolated PostgreSQL Databases + Redis + Kafka (KRaft)
  # ============================================================================
  identity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: ${POSTGRES_USER:-mochuong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mochuong_dev_pass}
    volumes:
      - identity_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mochuong} -d identity_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mavis-net

  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: ${POSTGRES_USER:-mochuong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mochuong_dev_pass}
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mochuong} -d catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mavis-net

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${POSTGRES_USER:-mochuong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mochuong_dev_pass}
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mochuong} -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mavis-net

  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${POSTGRES_USER:-mochuong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mochuong_dev_pass}
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mochuong} -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mavis-net

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mavis-net

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 25s
    networks:
      - mavis-net

  # ============================================================================
  # Spring Cloud Infrastructure Services (Edge Ports Only)
  # ============================================================================
  service-discovery:
    build:
      context: .
      dockerfile: service-discovery/Dockerfile
    ports:
      - "8761:8761"
    environment:
      EUREKA_HOSTNAME: service-discovery
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    mem_limit: 384m
    networks:
      - mavis-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://service-discovery:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-moc-huong-shop-super-secret-jwt-key-minimum-32-bytes-long-2026}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      service-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    networks:
      - mavis-net

  # ============================================================================
  # Business Microservices (Scale-Safe: expose only, NO fixed host ports)
  # ============================================================================
  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    expose:
      - "8081"
    environment:
      DB_HOST: identity-db
      DB_PORT: 5432
      DB_NAME: identity_db
      POSTGRES_USER: ${POSTGRES_USER:-mochuong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mochuong_dev_pass}
      EUREKA_URI: http://service-discovery:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-moc-huong-shop-super-secret-jwt-key-minimum-32-bytes-long-2026}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-MocHuong@123}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      identity-db:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s
    mem_limit: 512m
    networks:
      - mavis-net

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    expose:
      - "8082"
    environment:
      DB_HOST: catalog-db
      DB_PORT: 5432
      DB_NAME: catalog_db
      POSTGRES_USER: ${POSTGRES_USER:-mochuong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mochuong_dev_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_URI: http://service-discovery:8761/eureka
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      catalog-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s
    mem_limit: 512m
    networks:
      - mavis-net

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    expose:
      - "8083"
    environment:
      DB_HOST: order-db
      DB_PORT: 5432
      DB_NAME: order_db
      POSTGRES_USER: ${POSTGRES_USER:-mochuong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mochuong_dev_pass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-2000}
      EUREKA_URI: http://service-discovery:8761/eureka
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s
    mem_limit: 512m
    networks:
      - mavis-net

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    expose:
      - "8084"
    environment:
      DB_HOST: notification-db
      DB_PORT: 5432
      DB_NAME: notification_db
      POSTGRES_USER: ${POSTGRES_USER:-mochuong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mochuong_dev_pass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URI: http://service-discovery:8761/eureka
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s
    mem_limit: 512m
    networks:
      - mavis-net

volumes:
  identity_db_data:
  catalog_db_data:
  order_db_data:
  notification_db_data:
  kafka_data:

networks:
  mavis-net:
    driver: bridge
